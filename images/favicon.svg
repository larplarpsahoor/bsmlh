<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldMedallion" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#fff2c7"/>
      <stop offset="30%" stop-color="#f5d37d"/>
      <stop offset="65%" stop-color="#d9a738"/>
      <stop offset="100%" stop-color="#a87418"/>
    </linearGradient>

    <!-- Outer Gold Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe8a3"/>
      <stop offset="50%" stop-color="#c9972c"/>
      <stop offset="100%" stop-color="#6e4a0b"/>
    </linearGradient>

    <!-- Dark Obsidian Letter Gradient -->
    <linearGradient id="darkZ" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1924"/>
      <stop offset="100%" stop-color="#09080c"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Accent Ring (Ensures high contrast on both light and dark browser tabs) -->
  <circle cx="32" cy="32" r="31" fill="#0d0c11" opacity="0.35"/>

  <!-- Main Gold Medallion Circle -->
  <circle cx="32" cy="32" r="29" fill="url(#goldMedallion)" stroke="url(#goldBorder)" stroke-width="1.8" filter="url(#shadow)"/>

  <!-- Inner Refined Inscription Ring -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#ba8925" stroke-width="0.8" opacity="0.55"/>

  <!-- Cinzel Imperial Serif "Z" (Rendered via Vector Path for 100% crisp cross-browser fidelity) -->
  <path d="M 17,24.5 L 17,17.5 L 47,17.5 L 27.5,41.5 L 43,41.5 L 47,37 L 47,47.5 L 17,47.5 L 36.5,23.5 L 21,23.5 L 17,24.5 Z"
        fill="url(#darkZ)"
        stroke="#0d0c11"
        stroke-width="0.6"
        stroke-linejoin="round"/>
</svg>
